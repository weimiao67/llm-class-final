[project]
name = "housing-analyst"
version = "0.1.0"
description = "LLM-planned, deterministically executed analysis of Zillow ZHVI/ZORI city data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0,<3",
    "pydantic>=2.9,<3",
    "rapidfuzz>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["housing", "tools", "agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
